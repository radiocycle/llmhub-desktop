name: Build Linux Desktop Packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup AppImageTool
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage" || true
          sudo chmod +x /usr/local/bin/appimagetool || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Desktop Distributable
        run: ./gradlew createDistributable packageDeb --no-daemon

      - name: Build AppImage
        run: ./gradlew packageAppImage --no-daemon || true

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          
          # 1. Create standalone tar.gz from the distributable
          if [ -d "build/compose/binaries/main/app/llmhub" ]; then
            tar -czvf release-artifacts/llmhub-linux-x86_64.tar.gz -C build/compose/binaries/main/app llmhub
          fi

          # 2. Collect generated deb
          find build/compose/binaries/main/ -name "*.deb" -exec cp {} release-artifacts/llmhub-linux-amd64.deb \; || true

          # 3. Collect generated AppImage
          find build/compose/binaries/main/ -name "*.AppImage" -exec cp {} release-artifacts/llmhub-linux-x86_64.AppImage \; || true

          # 4. Generate Checksums
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt || true
          cd ..
          ls -la release-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llmhub-linux-packages
          path: release-artifacts/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi

          cat << 'NOTES' > release-notes.md
          ### LLMHub Desktop for Linux (Arch Linux, Debian/Ubuntu, Standalone)

          Features:
          - Full Material 3 Expressive UI adhering strictly to LLMHub design
          - Multi-provider rotation and failover (OpenAI, Anthropic, Google Gemini, Ollama/LM Studio)
          - OpenAI Wire (/chat/completions) & Responses (/responses) modes
          - Customizable reasoning effort & parameter names
          - Collapsible reasoning blocks, fuzzy search model picker
          - Native Linux XDG storage (~/.config/llmhub and ~/.local/share/llmhub)
          - Arch Linux PKGBUILD included for easy makepkg / yay / paru installation

          Download options:
          - Standalone Tarball: `llmhub-linux-x86_64.tar.gz` (extract and run `bin/llmhub`)
          - AppImage: `llmhub-linux-x86_64.AppImage` (single executable)
          - Debian/Ubuntu: `llmhub-linux-amd64.deb`
          - Arch Linux: use `packaging/PKGBUILD` or `packaging/PKGBUILD-bin`
          NOTES

          # Clean up any existing release and tag
          gh release delete "$TAG_NAME" --yes --cleanup-tag || true

          gh release create "$TAG_NAME" \
            release-artifacts/* \
            --target "${{ github.sha }}" \
            --title "LLMHub Desktop $TAG_NAME" \
            --notes-file release-notes.md
